name: Build TransferLab universal Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/transferlab-0.2.0-universal-ui-background

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            electron: 35.1.5
            flag: x64
          - arch: x86
            electron: 22.3.27
            flag: ia32
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Electron runtime
        if: matrix.arch == 'x86'
        run: npm pkg set devDependencies.electron=${{ matrix.electron }}
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/diagnostics.js
      - name: Build installer
        run: npm run dist -- --${{ matrix.flag }} --publish never
      - name: Normalize installer name
        shell: pwsh
        run: |
          $file = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $file) { throw "Installer not found" }
          Copy-Item $file.FullName "release/TransferLab-Setup-0.2.0-${{ matrix.arch }}.exe" -Force
      - name: Upload architecture installer
        uses: actions/upload-artifact@v4
        with:
          name: TransferLab-installer-${{ matrix.arch }}
          path: release/TransferLab-Setup-0.2.0-${{ matrix.arch }}.exe
          if-no-files-found: error

  universal-installer:
    name: Assemble single architecture-aware installer
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download x64 and x86 installers
        uses: actions/download-artifact@v4
        with:
          pattern: TransferLab-installer-*
          path: installer/payload
          merge-multiple: true
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build universal setup
        shell: pwsh
        run: |
          makensis /V3 installer/universal.nsi
          if (-not (Test-Path "TransferLab-Setup-0.2.0.exe")) { throw "Universal installer not generated" }
      - name: Upload universal installer
        uses: actions/upload-artifact@v4
        with:
          name: TransferLab-0.2.0-Universal-Windows-Installer
          path: TransferLab-Setup-0.2.0.exe
          if-no-files-found: error
